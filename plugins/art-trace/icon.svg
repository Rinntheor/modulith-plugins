<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="影像元数据工坊">
  <!--
    图标：一枚扫描取景框里套着指纹。
    「取景框」说的是这一步在**看**（解析容器里的每一个块），「指纹」说的是它留下的
    是**可追踪**的东西（作者信息、可见水印、隐形水印、台账）。

    刻意不使用渐变与阴影：宿主的侧边栏与插件详情页会把图标按 16~24px 渲染，
    而那两处尺寸下渐变只会糊成一团灰。纯线条 + 两个色阶在任何尺寸下都读得出来。

    颜色用的是宿主主题的强调色兜底值（Tailwind indigo 600 / 400）——
    图标是一个独立文件，读不到宿主注入的 CSS 变量，因此写死。
  -->
  <g fill="none" stroke="#4f46e5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- 取景框的四角 -->
    <path d="M7 15V10a3 3 0 0 1 3-3h5" />
    <path d="M33 7h5a3 3 0 0 1 3 3v5" />
    <path d="M41 33v5a3 3 0 0 1-3 3h-5" />
    <path d="M15 41h-5a3 3 0 0 1-3-3v-5" />
  </g>
  <g fill="none" stroke="#4f46e5" stroke-width="2.1" stroke-linecap="round">
    <!-- 指纹：中心脊线 -->
    <path d="M24 17c-3.9 0-7 3.1-7 7v3" />
    <path d="M24 17c3.9 0 7 3.1 7 7v3" />
    <!-- 指纹：两侧的脊线，越往外越短 -->
    <path d="M20 24v3.5" />
    <path d="M28 24v3.5" />
    <path d="M24 22.5c-1.4 0-2.5 1.1-2.5 2.5v3" />
    <path d="M24 22.5c1.4 0 2.5 1.1 2.5 2.5v3" />
    <path d="M24 26v3" />
  </g>
  <!-- 底层一道更浅的弧，暗示"还有更下面的一层"（隐形水印） -->
  <path
    d="M15.5 34.5c2.3 1.9 5.3 3 8.5 3s6.2-1.1 8.5-3"
    fill="none"
    stroke="#818cf8"
    stroke-width="2.1"
    stroke-linecap="round"
  />
</svg>
